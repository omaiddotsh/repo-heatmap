[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-heatmap"
dynamic = ["version"]
description = "Rank the files in a git repository by security-review risk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "omaiddotsh" }]
keywords = ["security", "code review", "git", "churn", "complexity", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["lizard>=1.24.1"]

[project.urls]
Homepage = "https://github.com/omaiddotsh/repo-heatmap"
Issues = "https://github.com/omaiddotsh/repo-heatmap/issues"
Changelog = "https://github.com/omaiddotsh/repo-heatmap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
heatmap = "repo_heatmap.cli:main"

[tool.setuptools.dynamic]
version = { attr = "repo_heatmap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_heatmap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["lizard"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
